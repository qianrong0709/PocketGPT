[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketgpt-base"
version = "1.0.0"
description = "Structure-function conditioned molecular generation with PocketGPT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "rdkit>=2024.3"]

[project.scripts]
pocketgpt = "pocketgpt.cli:main"

[tool.setuptools.packages.find]
include = ["pocketgpt*"]
